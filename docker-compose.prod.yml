services:
  postgres:
    image: postgres:16-alpine
    container_name: nuraskin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nuraskin-backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    deploy:
      resources:
        limits:
          # STARTING POINT: tune for DB usage
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: nuraskin-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes --requirepass ${REDIS_PASSWORD} --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - nuraskin-backend
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD} ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    deploy:
      resources:
        limits:
          # STARTING POINT: tune for DB usage
          memory: 512M

  server:
    image: ghcr.io/${GHCR_USERNAME}/nuraskin-server:${IMAGE_TAG:-latest}
    container_name: nuraskin-server
    restart: unless-stopped
    ports:
      - '127.0.0.1:4000:4000'
    env_file:
      - apps/server/.env.production
    environment:
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nuraskin-backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health > /dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    deploy:
      resources:
        limits:
          # STARTING POINT: adjust based on actual VPS RAM
          cpus: '1.5'
          memory: 768M

  frontend:
    image: ghcr.io/${GHCR_USERNAME}/nuraskin-frontend:${IMAGE_TAG:-latest}
    container_name: nuraskin-frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:8080'
    networks:
      - nuraskin-frontend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/ > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    deploy:
      resources:
        limits:
          # STARTING POINT: adjust based on actual usage
          cpus: '0.5'
          memory: 128M

  admin:
    image: ghcr.io/${GHCR_USERNAME}/nuraskin-admin:${IMAGE_TAG:-latest}
    container_name: nuraskin-admin
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:8080'
    networks:
      - nuraskin-frontend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/ > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    deploy:
      resources:
        limits:
          # STARTING POINT: adjust based on actual usage
          cpus: '0.5'
          memory: 128M

networks:
  nuraskin-frontend:
    driver: bridge
  nuraskin-backend:
    driver: bridge

volumes:
  postgres-data:
    driver: local
    labels:
      com.nuraskin.backup: 'true'
  redis-data:
    driver: local

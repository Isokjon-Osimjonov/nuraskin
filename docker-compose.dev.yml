version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nura
      POSTGRES_PASSWORD: nura
      POSTGRES_DB: nura_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  postgres_dev:

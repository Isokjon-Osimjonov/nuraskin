# Required secrets: GHCR_USERNAME, GHCR_TOKEN, PROD_HOST, PROD_USER,
# PROD_SSH_KEY, PROD_SERVER_PATH, ADMIN_BOT_TOKEN, TELEGRAM_ADMIN_CHAT_ID

name: Deploy → Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      sha:
        description: Image tag to roll back to
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            file: apps/server/Dockerfile
            build-args: ''
          - service: frontend
            file: apps/frontend/Dockerfile
            build-args: 'VITE_API_BASE_URL=https://api.nuraskin.uz'
          - service: admin
            file: apps/admin/Dockerfile
            build-args: 'VITE_API_BASE_URL=https://api.nuraskin.uz'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify lockfile sync
        run: |
          if ! pnpm install --frozen-lockfile 2>/dev/null; then
            echo "❌ pnpm-lock.yaml is out of sync!"
            echo "Run 'pnpm install' locally and commit the lockfile."
            exit 1
          fi
      - name: Generate image tag
        id: meta
        run: echo "version=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/nuraskin-${{ matrix.service }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ secrets.GHCR_USERNAME }}/nuraskin-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  approve:
    name: Approve
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - run: echo "Approved ${{ needs.build.outputs.image-tag }}"

  deploy:
    name: Deploy
    needs: [build, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 2117
          script: |
            cd ${{ secrets.PROD_SERVER_PATH }}
            git pull origin main
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            export IMAGE_TAG=${{ needs.build.outputs.image-tag }}
            export GHCR_USERNAME=${{ secrets.GHCR_USERNAME }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-deps server
            sleep 25
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend
            sleep 10
            docker compose -f docker-compose.prod.yml up -d --no-deps admin
            docker system prune -f
      - name: Health Check
        run: |
          sleep 45
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.nuraskin.uz/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check FAILED - got HTTP $STATUS"
            exit 1
          fi
          echo "Health check PASSED"

  rollback:
    name: Rollback
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 2117
          script: |
            cd ${{ secrets.PROD_SERVER_PATH }}
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            export IMAGE_TAG=${{ github.event.inputs.sha }}
            export GHCR_USERNAME=${{ secrets.GHCR_USERNAME }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-deps server
            sleep 25
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend
            sleep 10
            docker compose -f docker-compose.prod.yml up -d --no-deps admin

  notify:
    name: Notify
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          token: ${{ secrets.ADMIN_BOT_TOKEN }}
          message: |
            NuraSkin Deploy ${{ needs.deploy.result == 'success' && 'SUCCEEDED' || 'FAILED' }}
            SHA ${{ needs.build.outputs.image-tag }}
            By ${{ github.actor }}
            ${{ github.event.head_commit.message }}
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

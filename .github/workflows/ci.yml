name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --max-warnings=999

      - name: Format check
        run: pnpm format:check

      - name: Typecheck all
        run: pnpm typecheck

      - name: Build all
        run: pnpm nx run-many -t build

      - name: Test Docker build (server)
        run: docker build -f Dockerfile.server -t nuraskin-server:test .

      - name: Test Docker build (frontend)
        run: docker build -f Dockerfile.frontend -t nuraskin-frontend:test .

      - name: Test Docker build (admin)
        run: docker build -f Dockerfile.admin -t nuraskin-admin:test .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nura
          POSTGRES_PASSWORD: nura
          POSTGRES_DB: nura_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://nura:nura@localhost:5432/nura_test
        run: pnpm --filter @nuraskin/database run db:migrate

      - name: Run tests
        env:
          DATABASE_URL: postgresql://nura:nura@localhost:5432/nura_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-for-ci
        run: pnpm nx run-many -t test

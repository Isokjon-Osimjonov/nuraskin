name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --max-warnings=999

      - name: Format check
        run: pnpm format:check

      - name: Typecheck all
        run: pnpm typecheck

      - name: Build all
        run: pnpm nx run-many -t build

      - name: Test Docker build (server)
        run: docker build -f apps/server/Dockerfile -t nuraskin-server:test .

      - name: Test Docker build (frontend)
        run: docker build -f apps/frontend/Dockerfile --build-arg VITE_API_BASE_URL=https://api.nuraskin.uz -t nuraskin-frontend:test .

      - name: Test Docker build (admin)
        run: docker build -f apps/admin/Dockerfile --build-arg VITE_API_BASE_URL=https://api.nuraskin.uz -t nuraskin-admin:test .

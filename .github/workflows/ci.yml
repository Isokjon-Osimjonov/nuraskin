name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify lockfile sync
        run: |
          if ! pnpm install --frozen-lockfile 2>/dev/null; then
            echo "❌ pnpm-lock.yaml is out of sync!"
            echo "Run 'pnpm install' locally and commit the lockfile."
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml') }}

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify lockfile sync
        run: |
          if ! pnpm install --frozen-lockfile 2>/dev/null; then
            echo "❌ pnpm-lock.yaml is out of sync!"
            echo "Run 'pnpm install' locally and commit the lockfile."
            exit 1
          fi
      - run: NX_DAEMON=false pnpm exec nx run-many --target=typecheck --all --parallel=3

  lint:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify lockfile sync
        run: |
          if ! pnpm install --frozen-lockfile 2>/dev/null; then
            echo "❌ pnpm-lock.yaml is out of sync!"
            echo "Run 'pnpm install' locally and commit the lockfile."
            exit 1
          fi
      - run: NX_DAEMON=false pnpm exec nx run-many --target=lint --all --parallel=3
        continue-on-error: true

  build:
    needs: [typecheck, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify lockfile sync
        run: |
          if ! pnpm install --frozen-lockfile 2>/dev/null; then
            echo "❌ pnpm-lock.yaml is out of sync!"
            echo "Run 'pnpm install' locally and commit the lockfile."
            exit 1
          fi
      - run: NX_DAEMON=false pnpm exec nx run-many --target=build --all --parallel=false
